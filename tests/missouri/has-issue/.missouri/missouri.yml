transitions:
  - name: "close issue"
    command: "tisket issue close fix-the-widget"
    target: "../issue-closed"
    comparators:
      files:
        - path: ".tisket/bugs/"
          ignore: true
  - name: "edit issue status"
    command: "tisket issue edit fix-the-widget --status todo"
    target: "../issue-edited"
    comparators:
      files:
        - path: ".tisket/bugs/"
          ignore: true
  - name: "create second issue"
    command: "tisket issue create 'Write tests' -p bugs"
    target: "../has-two-issues"
    comparators:
      files:
        - path: ".tisket/bugs/"
          ignore: true
  - name: "edit to add due date"
    command: "tisket issue edit fix-the-widget --due 2025-06-15"
    target: "../has-issue-with-due-date"
    comparators:
      files:
        - path: ".tisket/bugs/"
          ignore: true
  - name: "set up divergent git branch"
    command: "setup-divergent-branch"
    target: "../has-issue-divergent"
    comparators:
      files:
        - path: ".tisket/bugs/"
          ignore: true

assertions:
  - name: "issue list shows issue"
    command: "tisket issue list -p bugs | grep -q 'Fix the widget'"
  - name: "issue show by slug works"
    command: "tisket issue show fix-the-widget | grep -q 'Fix the widget'"
  - name: "issue show by slug shows status"
    command: "tisket issue show fix-the-widget | grep -q todo"
  - name: "close nonexistent fails"
    command: "tisket issue close nonexistent"
    should_fail: true
    stderr: "error: issue 'nonexistent' not found\n"
  - name: "duplicate issue fails"
    command: "tisket issue create 'Fix the widget' -p bugs"
    should_fail: true
    stderr: "error: issue 'fix-the-widget' already exists\n"
  - name: "show nonexistent fails"
    command: "tisket issue show nonexistent"
    should_fail: true
    stderr: "error: issue 'nonexistent' not found\n"
  - name: "edit nonexistent fails"
    command: "tisket issue edit nonexistent --status todo"
    should_fail: true
    stderr: "error: issue 'nonexistent' not found\n"
  - name: "reopen non-closed issue fails"
    command: "tisket issue reopen fix-the-widget"
    should_fail: true
  - name: "invalid status fails"
    command: "tisket issue edit fix-the-widget --status invalid"
    should_fail: true
    stderr: "error: 'invalid' is not a valid status\n"
  - name: "search finds issue by title"
    command: "tisket search widget | grep -q 'Fix the widget'"
  - name: "path prints file path"
    command: "tisket issue path fix-the-widget | grep -q 'fix-the-widget.md'"
  - name: "path for nonexistent fails"
    command: "tisket issue path nonexistent"
    should_fail: true
    stderr: "error: issue 'nonexistent' not found\n"
  - name: "search no results"
    command: "tisket search nonexistent-term-xyz"
    stdout: ""
