assertions:
  - name: "show alpha-task has label a after removing b"
    command: "tisket issue show alpha-task | grep 'Labels:' | grep -qF 'a'"
  - name: "label values do not contain b"
    command: "test \"$(tisket issue show alpha-task | grep 'Labels:' | sed 's/.*Labels: *//')\" = 'a'"
  - name: "list --label b shows nothing"
    command: "tisket issue list -p bugs --label b"
    stdout: ""
