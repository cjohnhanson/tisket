assertions:
  - name: "show alpha-task has only label a"
    command: "tisket issue show alpha-task | grep 'Labels:' | grep -q 'a'"
  - name: "show alpha-task does not have label b"
    command: "tisket issue show alpha-task | grep 'Labels:' | grep -qv 'b'"
  - name: "list --label b shows nothing"
    command: "tisket issue list -p bugs --label b"
    stdout: ""
