assertions:
  - name: "list shows asterisk for divergent issue"
    command: "tisket issue list -p bugs | grep -q 'todo\\*'"
  - name: "list shows issue title"
    command: "tisket issue list -p bugs | grep -q 'Fix the widget'"
  - name: "show displays title"
    command: "tisket issue show fix-the-widget | grep -q 'Fix the widget'"
  - name: "show displays other branches"
    command: "tisket issue show fix-the-widget | grep -q 'feature/working-on-it'"
  - name: "show displays divergent field"
    command: "tisket issue show fix-the-widget | grep -q status"
