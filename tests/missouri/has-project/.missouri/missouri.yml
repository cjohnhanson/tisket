transitions:
  - name: "create issue"
    command: "tisket issue create 'Fix the widget' -p bugs"
    target: "../has-issue"
    comparators:
      files:
        - path: ".tisket/bugs/"
          ignore: true
  - name: "create issue with body"
    command: "create-issue-with-body"
    target: "../has-issue-with-body"
    comparators:
      files:
        - path: ".tisket/bugs/"
          ignore: true

  - name: "create issue with due date"
    command: "tisket issue create 'Fix the widget' -p bugs --due 2025-06-15"
    target: "../has-issue-with-due-date"
    comparators:
      files:
        - path: ".tisket/bugs/"
          ignore: true

  - name: "create issue with body flag"
    command: "tisket issue create 'Fix the widget' -p bugs --body 'The widget is broken.'"
    target: "../has-issue-with-body-flag"
    comparators:
      files:
        - path: ".tisket/bugs/"
          ignore: true
  - name: "create issue with body file"
    command: "create-issue-with-body-file"
    target: "../has-issue-with-body-file"
    comparators:
      files:
        - path: ".tisket/bugs/"
          ignore: true

assertions:
  - name: "project list shows bugs and default"
    command: "tisket project list"
    stdout: "bugs\ndefault\n"
  - name: "issue list is empty"
    command: "tisket issue list -p bugs"
    stdout: ""
  - name: "duplicate project fails"
    command: "tisket project create bugs"
    should_fail: true
    stderr: "error: project 'bugs' already exists\n"
  - name: "issue in nonexistent project fails"
    command: "tisket issue create 'Something' -p nonexistent"
    should_fail: true
    stderr: "error: project 'nonexistent' not found\n"
  - name: "create produces prefixed filename"
    command: "verify-create-prefix 'Prefix test' bugs"
  - name: "duplicate slug rejected even with different prefix"
    command: "verify-no-duplicate-slug 'Dup test' bugs"
  - name: "slug replaces punctuation with hyphens"
    command: "verify-slug-punctuation 'clc.yaml support' 'clc-yaml-support' bugs"
  - name: "slug collapses multiple punctuation to single hyphen"
    command: "verify-slug-punctuation 'fix...multiple dots' 'fix-multiple-dots' bugs"
  - name: "slug handles mixed punctuation"
    command: "verify-slug-punctuation 'hello, world!' 'hello-world' bugs"
