doc: |
  The issue is closed — its file moved to `.tisket/bugs/.closed/`. It
  won't show up in `tisket issue list` by default (use `--closed` to
  see it). You can still `show` it and `search` for it. You can't edit
  a closed issue — reopen it first.

transitions:
  - name: "reopen issue"
    command: "tisket issue reopen fix-the-widget"
    target: "../issue-reopened"
    doc: |
      Reopen the issue. This moves the file back out of `.closed/`,
      sets the status to `todo`, and makes it editable again. Nothing
      is lost — the full history is preserved in git.
    comparators:
      files:
        - path: ".tisket/bugs/"
          ignore: true

assertions:
  - name: "list hides closed issues by default"
    command: "tisket issue list -p bugs"
    stdout: ""
  - name: "list with --closed shows it"
    command: "tisket issue list -p bugs --closed | grep -q 'Fix the widget'"
  - name: "closed list shows done status"
    command: "tisket issue list -p bugs --closed | grep -q done"
  - name: "show still works on closed issue"
    command: "tisket issue show fix-the-widget | grep -q 'Fix the widget'"
  - name: "show closed issue has done status"
    command: "tisket issue show fix-the-widget | grep -q done"
  - name: "path prints closed issue path"
    command: "tisket issue path fix-the-widget | grep -q '.closed/.*fix-the-widget.md'"
  - name: "close already-closed fails"
    command: "tisket issue close fix-the-widget"
    should_fail: true
    stderr: "error: issue 'fix-the-widget' is already closed\n"
  - name: "edit closed issue fails"
    command: "tisket issue edit fix-the-widget --status todo"
    should_fail: true
    stderr: "error: issue 'fix-the-widget' is closed\n"
