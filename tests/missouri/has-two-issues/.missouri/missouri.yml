transitions:
  - name: "close first issue"
    command: "tisket issue close fix-the-widget"
    target: "../one-closed"
    comparators:
      files:
        - path: ".tisket/bugs/"
          ignore: true

assertions:
  - name: "list shows fix-the-widget"
    command: "tisket issue list -p bugs | grep -q 'Fix the widget'"
  - name: "list shows write-tests"
    command: "tisket issue list -p bugs | grep -q 'Write tests'"
  - name: "show second issue"
    command: "tisket issue show write-tests | grep -q 'Write tests'"
  - name: "show second issue has todo status"
    command: "tisket issue show write-tests | grep -q todo"
  - name: "duplicate second issue fails"
    command: "tisket issue create 'Write tests' -p bugs"
    should_fail: true
    stderr: "error: issue 'write-tests' already exists\n"
  - name: "search matches multiple issues"
    command: "tisket search todo | grep -q 'Fix the widget'"
  - name: "search matches write-tests too"
    command: "tisket search todo | grep -q 'Write tests'"
  - name: "search with project filter"
    command: "tisket search widget -p bugs | grep -q 'Fix the widget'"
