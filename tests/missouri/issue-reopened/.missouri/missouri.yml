doc: ""

assertions:
  - name: "reopened issue is listed"
    command: "tisket issue list -p bugs | grep -q 'Fix the widget'"
  - name: "reopened issue has todo status"
    command: "tisket issue list -p bugs | grep -q todo"
  - name: "show reflects reopened status"
    command: "tisket issue show fix-the-widget | grep -q 'Fix the widget'"
  - name: "show has todo status"
    command: "tisket issue show fix-the-widget | grep -q todo"
