# A declared git tracker that the cache does not hold yet. Nothing
# reaches the network until an explicit sync, so the tracker is
# unavailable and every other command still works.
transitions:
  - name: "sync the remote tracker"
    command: "tisket store sync"
    target: "../has-synced-tracker"
    comparators:
      files:
        - path: ".tisket/"
          ignore: true
        - path: "upstream/"
          ignore: true
        - path: ".mdstore-cache/"
          ignore: true
        - path: "stores.yml"
          ignore: true

assertions:
  - name: "the remote tracker is unavailable before a sync"
    command: "tisket store list | grep '^up ' | grep -q 'unavailable'"
  - name: "the message says what to do"
    command: "tisket store list | grep '^up ' | grep -q 'run store sync'"
  - name: "reads do not reach the cache"
    command: "test ! -d .mdstore-cache"
  - name: "the local tracker still works"
    command: "tisket issue list"
    stdout: ""
  # gix has no in-process ssh transport, and tisket spawns no ssh
  # process, so an ssh URL is refused and the message names https.
  - name: "an ssh tracker is refused with the https alternative"
    command: |
      mkdir -p sshy && (cd sshy && tisket init >/dev/null &&
        printf 'format: 2\nstores:\n  - alias: h\n    git: git@example.com:org/kb.git\n' > stores.yml &&
        ! tisket store sync >/dev/null 2>&1 &&
        tisket store sync 2>&1 | grep -q 'https' &&
        test ! -d .mdstore-cache) && rm -rf sshy
