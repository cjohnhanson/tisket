transitions:
  - name: "reopen preserves body and scratch"
    command: "tisket issue reopen fix-the-widget"
    target: "../issue-with-body-reopened"
    comparators:
      files:
        - path: ".tisket/bugs/"
          ignore: true

assertions:
  - name: "show displays title after close"
    command: "tisket issue show fix-the-widget | grep -q 'Fix the widget'"
  - name: "show displays done status"
    command: "tisket issue show fix-the-widget | grep -q done"
  - name: "show displays body after close"
    command: "tisket issue show fix-the-widget | grep -q 'widget is broken'"
  - name: "path returns closed path"
    command: "tisket issue path fix-the-widget | grep -q '.closed/.*fix-the-widget.md'"
