transitions:
  - name: "reopen preserves body and scratch"
    command: "tisket issue reopen fix-the-widget"
    target: "../issue-with-body-reopened"
    comparators:
      files:
        - path: ".tisket/bugs/fix-the-widget.md"
          command: "compare-issue"

assertions:
  - name: "show displays body after close"
    command: "tisket issue show fix-the-widget"
    stdout: |
      fix-the-widget (bugs)

        Title:    Fix the widget
        Status:   done

      The widget is broken when users click the save button.
      Reproduce by opening the settings page and clicking save twice.
  - name: "path returns closed path"
    command: "tisket issue path fix-the-widget"
    stdout: ".tisket/bugs/.closed/fix-the-widget.md\n"
