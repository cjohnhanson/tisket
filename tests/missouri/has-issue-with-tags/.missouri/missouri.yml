assertions:
  # --- Tags persisted in frontmatter ---
  - name: "issue frontmatter has tags section"
    command: "grep -q 'tags:' .tisket/bugs/fix-the-widget.md"

  - name: "estimate tag present"
    command: "grep -q 'estimate:' .tisket/bugs/fix-the-widget.md"

  - name: "severity tag present"
    command: "grep -q 'severity: critical' .tisket/bugs/fix-the-widget.md"

  # --- Show displays tags ---
  - name: "show displays estimate tag"
    command: "tisket issue show fix-the-widget | grep -q 'estimate'"

  - name: "show displays severity tag"
    command: "tisket issue show fix-the-widget | grep -q 'severity'"

  # --- JSON output includes tags ---
  - name: "show json has tags object"
    command: "tisket issue show fix-the-widget --format json | jq -e '.tags'"

  - name: "show json estimate is 4"
    command: "tisket issue show fix-the-widget --format json | jq -e '.tags.estimate == 4'"

  - name: "show json severity is critical"
    command: "tisket issue show fix-the-widget --format json | jq -r '.tags.severity'"
    stdout: "critical\n"

  # --- Round-trip: other fields unchanged ---
  - name: "title unchanged after tag edit"
    command: "tisket issue show fix-the-widget --field title"
    stdout: "Fix the widget\n"

  - name: "status unchanged after tag edit"
    command: "tisket issue show fix-the-widget --field status"
    stdout: "todo\n"

  # --- List filtering by tag ---
  - name: "list --where severity=critical finds issue"
    command: "tisket issue list --where severity=critical | grep -q 'fix-the-widget'"

  - name: "list --where estimate=4 finds issue"
    command: "tisket issue list --where estimate=4 | grep -q 'fix-the-widget'"

  - name: "list --where severity=low finds nothing"
    command: "! tisket issue list --where severity=low | grep -q 'fix-the-widget'"

  - name: "list --where nonexistent=value finds nothing"
    command: "! tisket issue list --where nonexistent=value | grep -q 'fix-the-widget'"

transitions:
  - name: "edit tag value"
    command: "tisket issue edit fix-the-widget --tag severity=low"
    target: "../tag-edited"
    comparators:
      files:
        - path: ".tisket/bugs/"
          ignore: true

  - name: "remove tag"
    command: "tisket issue edit fix-the-widget --untag estimate"
    target: "../tag-removed"
    comparators:
      files:
        - path: ".tisket/bugs/"
          ignore: true
