setup:
  - name: "build tisket"
    command: "cargo build --quiet --manifest-path ../../Cargo.toml"
  # A wrapper over a copied binary: the wrapper pins --user-config to a
  # path that never exists, so the machine's real
  # ~/.config/tisket/config.yml cannot leak a root-store fallback into
  # the suite. The flag's last occurrence wins, so a test that needs a
  # config passes its own. The binary is copied beside the wrapper, so
  # nothing that touches target/ mid-run can turn the wrapper into a
  # self-exec loop.
  - name: "wrap tisket binary"
    command: |
      mkdir -p .missouri/bin &&
      cp ../../target/debug/tisket .missouri/bin/tisket-bin &&
      printf '#!/bin/sh\nexec "$(dirname "$0")/tisket-bin" --user-config /nonexistent-missouri-user-config.yml "$@"\n' > .missouri/bin/tisket &&
      chmod +x .missouri/bin/tisket .missouri/bin/tisket-bin

packages:
  - git
  - jq

env:
  NO_COLOR: "1"
  # Each test path gets its own cache and registry, so a store test
  # never reads or writes the user's real ones.
  MDSTORE_CACHE_DIR: ".mdstore-cache"
  MDSTORE_REGISTRY: ".mdstore-registry.yml"
  # missouri clears the child environment, so bare `git commit` falls
  # back to ident auto-detection. On a host whose hostname has no
  # domain, that detection fails. The explicit identity removes the
  # host dependence.
  GIT_AUTHOR_NAME: "test"
  GIT_AUTHOR_EMAIL: "test@example.com"
  GIT_COMMITTER_NAME: "test"
  GIT_COMMITTER_EMAIL: "test@example.com"
