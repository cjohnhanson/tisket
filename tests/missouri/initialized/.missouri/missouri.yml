transitions:
  - name: "create bugs project"
    command: "tisket project create bugs"
    target: "../has-project"

  - name: "populate many issues"
    command: "populate-issues.sh"
    target: "../has-many-issues"
    comparators:
      files:
        - path: ".tisket/"
          ignore: true

  # A user-level tracker that declares two project trackers. One epic
  # holds children that live in both of them.
  - name: "declare two project trackers"
    command: |
      for d in proj-a proj-b; do
        mkdir -p $d && (cd $d && tisket init >/dev/null)
      done &&
      (cd proj-a && tisket issue create 'Add the parser' >/dev/null) &&
      (cd proj-b && tisket issue create 'Wire the client' >/dev/null) &&
      printf 'format: 2\nstores:\n  - alias: a\n    path: ./proj-a\n  - alias: b\n    path: ./proj-b\n' > stores.yml &&
      A=$(cd proj-a && tisket issue list --format json | jq -r '.[0].id') &&
      B=$(cd proj-b && tisket issue list --format json | jq -r '.[0].id') &&
      tisket issue create 'Ship the integration' --children "a:$A,b:$B" >/dev/null
    target: "../has-cross-repo-epic"
    comparators:
      files:
        - path: ".tisket/"
          ignore: true
        - path: "proj-a/"
          ignore: true
        - path: "proj-b/"
          ignore: true
        - path: "stores.yml"
          ignore: true

assertions:
  - name: "prime succeeds"
    command: "tisket prime"
  - name: "issue list is empty"
    command: "tisket issue list"
    stdout: ""
  - name: "project list shows default"
    command: "tisket project list"
    stdout: "default\n"
  - name: "create issue in nonexistent project fails"
    command: "tisket issue create 'Something' -p nonexistent"
    should_fail: true
    stderr: "error: project 'nonexistent' not found\n"
  - name: "close nonexistent issue fails"
    command: "tisket issue close foo"
    should_fail: true
    stderr: "error: issue 'foo' not found\n"
  - name: "init when already initialized fails"
    command: "tisket init"
    should_fail: true
    stderr: "error: already initialized (tisket.yml exists)\n"
