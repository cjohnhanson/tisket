transitions:
  - name: "create bugs project"
    command: "tisket project create bugs"
    target: "../has-project"

  - name: "populate many issues"
    command: "populate-issues.sh"
    target: "../has-many-issues"
    comparators:
      files:
        - path: ".tisket/"
          ignore: true

assertions:
  - name: "prime succeeds"
    command: "tisket prime"
  - name: "issue list is empty"
    command: "tisket issue list"
    stdout: ""
  - name: "project list shows default"
    command: "tisket project list"
    stdout: "default\n"
  - name: "create issue in nonexistent project fails"
    command: "tisket issue create 'Something' -p nonexistent"
    should_fail: true
    stderr: "error: project 'nonexistent' not found\n"
  - name: "close nonexistent issue fails"
    command: "tisket issue close foo"
    should_fail: true
    stderr: "error: issue 'foo' not found\n"
  - name: "init when already initialized fails"
    command: "tisket init"
    should_fail: true
    stderr: "error: already initialized (tisket.yml exists)\n"
