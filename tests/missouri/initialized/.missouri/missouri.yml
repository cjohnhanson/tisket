transitions:
  - name: "create bugs project"
    command: "tisket project create bugs"
    target: "../has-project"

  - name: "populate many issues"
    command: "populate-issues.sh"
    target: "../has-many-issues"
    comparators:
      files:
        - path: ".tisket/"
          ignore: true

  # A user-level tracker that declares two project trackers. One epic
  # holds children that live in both of them.
  - name: "declare two project trackers"
    command: |
      for d in proj-a proj-b; do
        mkdir -p $d && (cd $d && tisket init >/dev/null)
      done &&
      (cd proj-a && tisket issue create 'Add the parser' >/dev/null) &&
      (cd proj-b && tisket issue create 'Wire the client' >/dev/null) &&
      printf 'format: 2\nstores:\n  - alias: a\n    path: ./proj-a\n  - alias: b\n    path: ./proj-b\n' > stores.yml &&
      A=$(cd proj-a && tisket issue list --format json | jq -r '.[0].id') &&
      B=$(cd proj-b && tisket issue list --format json | jq -r '.[0].id') &&
      tisket issue create 'Ship the integration' --children "a:$A,b:$B" >/dev/null
    target: "../has-cross-repo-epic"
    comparators:
      files:
        - path: ".tisket/"
          ignore: true
        - path: "proj-a/"
          ignore: true
        - path: "proj-b/"
          ignore: true
        - path: "stores.yml"
          ignore: true

  # A tracker declared by git URL: a sibling repository, read-only from
  # here, and not readable at all until an explicit sync.
  - name: "declare a remote tracker"
    command: |
      mkdir -p upstream && (cd upstream &&
        tisket init >/dev/null &&
        tisket issue create 'Upstream bug' >/dev/null &&
        git init -q -b main && git add tisket.yml .tisket &&
        git -c user.email=t@e -c user.name=t commit -qm one &&
        git tag v1 &&
        tisket issue create 'Later issue' >/dev/null &&
        git add .tisket && git -c user.email=t@e -c user.name=t commit -qm two &&
        git branch side) &&
      printf 'format: 2\nstores:\n  - alias: up\n    git: file://%s/upstream\n' "$PWD" > stores.yml
    target: "../has-remote-tracker"
    comparators:
      files:
        - path: ".tisket/"
          ignore: true
        - path: "upstream/"
          ignore: true
        - path: "stores.yml"
          ignore: true

assertions:
  - name: "prime succeeds"
    command: "tisket prime"
  - name: "issue list is empty"
    command: "tisket issue list"
    stdout: ""
  - name: "project list shows default"
    command: "tisket project list"
    stdout: "default\n"
  - name: "create issue in nonexistent project fails"
    command: "tisket issue create 'Something' -p nonexistent"
    should_fail: true
    stderr: "error: project 'nonexistent' not found\n"
  - name: "close nonexistent issue fails"
    command: "tisket issue close foo"
    should_fail: true
    stderr: "error: issue 'foo' not found\n"
  - name: "init when already initialized fails"
    command: "tisket init"
    should_fail: true
    stderr: "error: already initialized (tisket.yml exists)\n"
  # The bundled documentation. These assertions sat in an orphaned
  # state directory that no transition reached, so they never ran.
  - name: "docs lists every page"
    command: "tisket docs | grep -q what-is-tisket && tisket docs | grep -q cli-reference"
  - name: "docs lists in Diataxis order"
    command: "tisket docs | head -1 | grep -q getting-started"
  - name: "docs prints one page"
    command: "tisket docs what-is-tisket | grep -q 'markdown files in the git repository'"
  - name: "docs takes a prefix"
    command: "tisket docs what | grep -q 'What is Tisket'"
  - name: "docs search finds a match"
    command: "tisket docs search frontmatter | grep -q what-is-tisket"
  - name: "docs search with no match fails"
    command: "tisket docs search zzzznotathing"
    should_fail: true
  - name: "docs --all prints every page whole"
    command: "tisket docs --all | grep -q '<!-- page: cli-reference (reference) -->'"
  - name: "an unknown topic fails and lists"
    command: "tisket docs nope"
    should_fail: true
