assertions:
  - name: "issue show displays due date"
    command: "tisket issue show fix-the-widget | grep -q 'Due:.*2025-06-15'"
  - name: "issue list shows issue with due date"
    command: "tisket issue list -p bugs | grep -q 'Fix the widget'"
  - name: "search finds issue by due_date"
    command: "tisket search 2025-06-15 | grep -q 'due_date'"

transitions:
  - name: "edit due date"
    command: "tisket issue edit fix-the-widget --due 2025-12-31"
    target: "../issue-due-date-edited"
    comparators:
      files:
        - path: ".tisket/bugs/"
          ignore: true
  - name: "close issue with due date"
    command: "tisket issue close fix-the-widget"
    target: "../issue-with-due-date-closed"
    comparators:
      files:
        - path: ".tisket/bugs/.closed/"
          ignore: true
