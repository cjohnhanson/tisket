transitions:
  - name: "edit preserves body and scratch"
    command: "tisket issue edit fix-the-widget --status todo"
    target: "../issue-with-body-edited"
    comparators:
      files:
        - path: ".tisket/bugs/"
          ignore: true
  - name: "close preserves body and scratch"
    command: "tisket issue close fix-the-widget"
    target: "../issue-with-body-closed"
    comparators:
      files:
        - path: ".tisket/bugs/"
          ignore: true

assertions:
  - name: "show displays title"
    command: "tisket issue show fix-the-widget | grep -q 'Fix the widget'"
  - name: "show displays body"
    command: "tisket issue show fix-the-widget | grep -q 'widget is broken'"
  - name: "show displays body detail"
    command: "tisket issue show fix-the-widget | grep -q 'clicking save twice'"
  - name: "path returns file path"
    command: "tisket issue path fix-the-widget | grep -q 'fix-the-widget.md'"

  # --- JSON output with body ---
  - name: "show format json includes body"
    command: "tisket issue show fix-the-widget --format json | jq -r '.body' | grep -q 'widget is broken'"
  - name: "show format json includes scratch"
    command: "tisket issue show fix-the-widget --format json | jq -r '.scratch' | grep -q 'double-bind'"
  - name: "show field body"
    command: "tisket issue show fix-the-widget --field body | grep -q 'widget is broken'"

  # --- Body manipulation: edit --body replaces existing body ---
  - name: "edit body replaces existing body"
    command: "tisket issue edit fix-the-widget --body 'Replaced content' && tisket issue show fix-the-widget --format json | jq -r '.body'"
    stdout: "Replaced content\n"

  # --- Body manipulation: edit --append to existing body ---
  - name: "edit append to existing body"
    command: "tisket issue edit fix-the-widget --append 'Appended line' && tisket issue show fix-the-widget --format json | jq -r '.body' | grep -q 'Appended line'"
  - name: "edit append preserves existing body"
    command: "tisket issue edit fix-the-widget --append 'Extra' && tisket issue show fix-the-widget --format json | jq -r '.body' | grep -q 'widget is broken'"
