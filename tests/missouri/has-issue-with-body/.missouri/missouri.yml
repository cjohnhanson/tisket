transitions:
  - name: "edit preserves body and scratch"
    command: "tisket issue edit fix-the-widget --status todo"
    target: "../issue-with-body-edited"
    comparators:
      files:
        - path: ".tisket/bugs/fix-the-widget.md"
          command: "compare-issue"
  - name: "close preserves body and scratch"
    command: "tisket issue close fix-the-widget"
    target: "../issue-with-body-closed"
    comparators:
      files:
        - path: ".tisket/bugs/.closed/fix-the-widget.md"
          command: "compare-issue"

assertions:
  - name: "show displays body but not scratch"
    command: "tisket issue show fix-the-widget"
    stdout: |
      fix-the-widget (bugs)

        Title:    Fix the widget
        Status:   todo

      The widget is broken when users click the save button.
      Reproduce by opening the settings page and clicking save twice.
  - name: "path returns file path"
    command: "tisket issue path fix-the-widget"
    stdout: ".tisket/bugs/fix-the-widget.md\n"
