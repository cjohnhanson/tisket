transitions:
  - name: "edit preserves body and scratch"
    command: "tisket issue edit fix-the-widget --status todo"
    target: "../issue-with-body-edited"
    comparators:
      files:
        - path: ".tisket/bugs/"
          ignore: true
  - name: "close preserves body and scratch"
    command: "tisket issue close fix-the-widget"
    target: "../issue-with-body-closed"
    comparators:
      files:
        - path: ".tisket/bugs/"
          ignore: true

assertions:
  - name: "show displays title"
    command: "tisket issue show fix-the-widget | grep -q 'Fix the widget'"
  - name: "show displays body"
    command: "tisket issue show fix-the-widget | grep -q 'widget is broken'"
  - name: "show displays body detail"
    command: "tisket issue show fix-the-widget | grep -q 'clicking save twice'"
  - name: "path returns file path"
    command: "tisket issue path fix-the-widget | grep -q 'fix-the-widget.md'"
