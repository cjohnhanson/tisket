assertions:
  - name: "estimate tag removed"
    command: "! grep -q 'estimate:' .tisket/bugs/fix-the-widget.md"

  - name: "severity still present"
    command: "grep -q 'severity: critical' .tisket/bugs/fix-the-widget.md"

  - name: "show json has no estimate key"
    command: "tisket issue show fix-the-widget --format json | jq -e '.tags.estimate == null'"

  - name: "show json severity still critical"
    command: "tisket issue show fix-the-widget --format json | jq -r '.tags.severity'"
    stdout: "critical\n"

  - name: "list --where estimate=4 no longer finds issue"
    command: "! tisket issue list --where estimate=4 | grep -q 'fix-the-widget'"

  - name: "list --where severity=critical still finds issue"
    command: "tisket issue list --where severity=critical | grep -q 'fix-the-widget'"
