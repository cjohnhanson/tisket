doc: |
  Start with an empty directory. Tisket hasn't been initialized — there's no
  `tisket.yml`, no `.tisket/` directory, nothing. Any tisket command that
  expects a repository will fail with "not a tisket repository."

transitions:
  - name: "tisket init"
    command: "tisket init"
    target: "../initialized"
    doc: |
      Initialize tisket. This creates `tisket.yml` at the root (configuring
      where issues are stored) and a `.tisket/default/` directory with the
      default project. That's it — two files and a directory. Everything
      tisket does from here is reading and writing markdown files inside
      `.tisket/`.

assertions:
  - name: "issue list fails before init"
    command: "tisket issue list"
    should_fail: true
    stderr: "error: not a tisket repository (tisket.yml not found)\n"
  - name: "project list fails before init"
    command: "tisket project list"
    should_fail: true
    stderr: "error: not a tisket repository (tisket.yml not found)\n"
  - name: "prime fails before init"
    command: "tisket prime"
    should_fail: true
    stderr: "error: not a tisket repository (tisket.yml not found)\n"
