doc: |
  The user-level fallback. A cwd with no tracker reads the configured
  root tracker and says so; a write refuses and names --home; --home
  writes to the root. Every command passes --user-config so the real
  ~/.config/mdstore/config.yml never participates.
transitions:
  - name: "a write lands in the root only through --home"
    command: |
      cd work/src &&
      tisket --user-config ../../cfg.yml --home issue create 'Filed from work' >/dev/null 2>&1 &&
      cd ../.. && tisket --root rootstore issue list | grep -q 'Filed from work' &&
      echo HOME_OK
    target: "../root-written-via-home"
    stdout: "HOME_OK\n"
    comparators:
      files:
        - path: "rootstore/"
          ignore: true
        - path: "cfg.yml"
          ignore: true
        - path: "work/"
          ignore: true
assertions:
  - name: "a read from a storeless cwd falls back and announces it"
    command: "cd work/src && tisket --user-config ../../cfg.yml issue list 2>err.txt >out.txt && grep -q 'reading root tracker' err.txt && grep -q 'Root issue' out.txt && rm err.txt out.txt"
  - name: "a write from a storeless cwd refuses and names --home"
    command: "cd work/src && ! tisket --user-config ../../cfg.yml issue create nope >/dev/null 2>&1 && tisket --user-config ../../cfg.yml issue create nope 2>&1 | grep -q -- '--home'"
  - name: "with no config the read fails naming both facts"
    command: "cd work/src && ! tisket --user-config ../../absent.yml issue list >/dev/null 2>&1 && tisket --user-config ../../absent.yml issue list 2>&1 | grep -q 'store root <path>'"
  - name: "an explicit --root never falls back"
    command: "! tisket --user-config cfg.yml --root work issue list >/dev/null 2>&1"
  - name: "a subdirectory of a tracker resolves it by walking"
    command: "cd rootstore && mkdir -p src/deep && cd src/deep && tisket --user-config ../../../cfg.yml issue list 2>err.txt | grep -q 'Root issue' && grep -q 'using tracker at' err.txt && rm err.txt && cd .. && rmdir deep && cd .. && rmdir src"
  - name: "--home with no config names the fix"
    command: "cd work/src && ! tisket --user-config ../../absent.yml --home issue list >/dev/null 2>&1 && tisket --user-config ../../absent.yml --home issue list 2>&1 | grep -q 'store root <path>'"
  - name: "a config whose root has no tracker is an error, not unconfigured"
    command: |
      printf 'format: 1\nroot_store: %s/work\n' "$PWD" > bad.yml &&
      ! tisket --user-config bad.yml issue list >/dev/null 2>&1 &&
      tisket --user-config bad.yml issue list 2>&1 | grep -q 'has no tisket.yml' &&
      rm bad.yml
