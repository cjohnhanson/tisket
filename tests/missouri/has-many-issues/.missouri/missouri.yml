assertions:
  # --- Search: regex pattern ---
  - name: "search with regex matches single issue"
    command: "tisket search 'OAuth.*refresh'"
    stdout: |
      ID                            STATUS   PROJECT  TITLE                         MATCH
      fix-oauth2-token-refresh-bug  backlog  core     Fix OAuth2 token refresh bug  title

  # --- Search: case sensitivity ---
  - name: "search uppercase CRITICAL matches title"
    command: "tisket search CRITICAL"
    stdout: |
      ID                                              STATUS   PROJECT  TITLE                                           MATCH
      critical-production-memory-leak-in-worker-pool  backlog  core     CRITICAL production memory leak in worker pool  title
  - name: "search lowercase critical has no match"
    command: "tisket search critical"
    stdout: ""

  # --- Search: multiple matches in same issue ---
  - name: "search term in title and labels"
    command: "tisket search search"
    stdout: |
      ID                                     STATUS   PROJECT  TITLE                                  MATCH
      add-search-functionality-to-dashboard  backlog  core     Add search functionality to dashboard  title, labels

  # --- Search: cross-project ---
  - name: "search PostgreSQL matches across projects"
    command: "tisket search PostgreSQL"
    stdout: |
      ID                                      STATUS   PROJECT  TITLE                                   MATCH
      document-postgresql-backup-procedures   backlog  docs     Document PostgreSQL backup procedures   title
      refactor-postgresql-connection-pooling  backlog  core     Refactor PostgreSQL connection pooling  title

  # --- Search: project filter ---
  - name: "search with project filter restricts results"
    command: "tisket search PostgreSQL -p docs"
    stdout: |
      ID                                     STATUS   PROJECT  TITLE                                  MATCH
      document-postgresql-backup-procedures  backlog  docs     Document PostgreSQL backup procedures  title

  # --- Search: assignee with project filter ---
  - name: "search assignee in specific project"
    command: "tisket search alice -p infra"
    stdout: |
      ID                                               STATUS   PROJECT  TITLE                                            MATCH
      configure-load-balancer-health-check-thresholds  backlog  infra    Configure load balancer health check thresholds  assignee
      remove-stale-dns-records-from-production-zone    done     infra    Remove stale DNS records from production zone    assignee
      tune-database-connection-pool-limits-under-load  backlog  infra    Tune database connection pool limits under load  assignee

  # --- Search: closed issue ---
  - name: "search finds closed issues"
    command: "tisket search bcrypt"
    stdout: |
      ID                                           STATUS  PROJECT  TITLE                                        MATCH
      resolve-deprecated-bcrypt-hashing-algorithm  done    core     Resolve deprecated bcrypt hashing algorithm  title

  # --- Search: no results ---
  - name: "search with no matches returns empty"
    command: "tisket search xyzzy123foobarbaz"
    stdout: ""

  # --- Search: invalid project ---
  - name: "search with invalid project fails"
    command: "tisket search pattern -p nonexistent"
    should_fail: true
    stderr: "error: project 'nonexistent' not found\n"

  # --- Show: all metadata fields ---
  - name: "show displays priority assignee and labels"
    command: "tisket issue show fix-oauth2-token-refresh-bug"
    stdout: |
      fix-oauth2-token-refresh-bug (core)

        Title:    Fix OAuth2 token refresh bug
        Status:   backlog
        Priority: 1
        Assignee: alice
        Labels:   bug, auth, security

  # --- Show: issue with no assignee ---
  - name: "show omits empty optional fields"
    command: "tisket issue show critical-production-memory-leak-in-worker-pool"
    stdout: |
      critical-production-memory-leak-in-worker-pool (core)

        Title:    CRITICAL production memory leak in worker pool
        Status:   backlog
        Priority: 1
        Labels:   bug, urgent, performance

  # --- Show: in_progress status ---
  - name: "show displays non-default status"
    command: "tisket issue show fix-race-condition-in-queue-processor"
    stdout: |
      fix-race-condition-in-queue-processor (core)

        Title:    Fix race condition in queue processor
        Status:   in_progress
        Priority: 1
        Assignee: alice
        Labels:   bug, performance

  # --- Show: closed issue ---
  - name: "show works for closed issue"
    command: "tisket issue show resolve-deprecated-bcrypt-hashing-algorithm"
    stdout: |
      resolve-deprecated-bcrypt-hashing-algorithm (core)

        Title:    Resolve deprecated bcrypt hashing algorithm
        Status:   done
        Priority: 2
        Assignee: eve
        Labels:   security, migration
