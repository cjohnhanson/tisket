assertions:
  # --- Search: regex pattern ---
  - name: "search with regex matches single issue"
    command: "tisket search 'OAuth.*refresh' | grep -q 'Fix OAuth2 token refresh bug'"
  - name: "search regex returns exactly one result"
    command: "test $(tisket search 'OAuth.*refresh' | wc -l) -eq 2"

  # --- Search: case sensitivity ---
  - name: "search uppercase CRITICAL matches title"
    command: "tisket search CRITICAL | grep -q 'CRITICAL production memory leak'"
  - name: "search lowercase critical has no match"
    command: "tisket search critical"
    stdout: ""

  # --- Search: multiple matches in same issue ---
  - name: "search term in title and labels"
    command: "tisket search search | grep -q 'title, labels'"

  # --- Search: cross-project ---
  - name: "search PostgreSQL matches docs project"
    command: "tisket search PostgreSQL | grep -q docs"
  - name: "search PostgreSQL matches core project"
    command: "tisket search PostgreSQL | grep -q core"

  # --- Search: project filter ---
  - name: "search with project filter restricts results"
    command: "tisket search PostgreSQL -p docs | grep -q 'Document PostgreSQL backup procedures'"
  - name: "search with project filter excludes other project"
    command: "tisket search PostgreSQL -p docs | grep -qv core"

  # --- Search: assignee with project filter ---
  - name: "search assignee in specific project"
    command: "tisket search alice -p infra | grep -q 'Configure load balancer'"

  # --- Search: closed issue ---
  - name: "search finds closed issues"
    command: "tisket search bcrypt | grep -q 'Resolve deprecated bcrypt'"

  # --- Search: no results ---
  - name: "search with no matches returns empty"
    command: "tisket search xyzzy123foobarbaz"
    stdout: ""

  # --- Search: invalid project ---
  - name: "search with invalid project fails"
    command: "tisket search pattern -p nonexistent"
    should_fail: true
    stderr: "error: project 'nonexistent' not found\n"

  # --- Show: all metadata fields ---
  - name: "show displays priority"
    command: "tisket issue show fix-oauth2-token-refresh-bug | grep -q 'Priority: 1'"
  - name: "show displays assignee"
    command: "tisket issue show fix-oauth2-token-refresh-bug | grep -q 'Assignee: alice'"
  - name: "show displays labels"
    command: "tisket issue show fix-oauth2-token-refresh-bug | grep -q 'Labels:.*bug.*auth.*security'"

  # --- Show: issue with no assignee ---
  - name: "show omits assignee when empty"
    command: "tisket issue show critical-production-memory-leak-in-worker-pool | grep -qv Assignee"
  - name: "show displays title for no-assignee issue"
    command: "tisket issue show critical-production-memory-leak-in-worker-pool | grep -q 'CRITICAL production memory leak'"

  # --- Show: in_progress status ---
  - name: "show displays non-default status"
    command: "tisket issue show fix-race-condition-in-queue-processor | grep -q in_progress"

  # --- Show: closed issue ---
  - name: "show works for closed issue"
    command: "tisket issue show resolve-deprecated-bcrypt-hashing-algorithm | grep -q 'Resolve deprecated bcrypt'"
  - name: "show closed issue has done status"
    command: "tisket issue show resolve-deprecated-bcrypt-hashing-algorithm | grep -q done"
