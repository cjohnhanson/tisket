[package]
name = "tisket"
version = "0.1.0"
edition = "2024"
description = "Plaintext issue tracker for humans and coding agents"

[dependencies]
camino = { version = "1", features = ["serde1"] }
clap = { version = "4", features = ["derive", "env", "unicode", "wrap_help"] }
miette = { version = "7", features = ["fancy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
colored = "3.1.1"
grep-regex = "0.1.14"
grep-matcher = "0.1.8"
gix = { version = "0.80.0", default-features = false, features = ["basic"] }
mdstore = { path = "../mdstore" }
sigpipe = "0.1.3"
