[package]
name = "tisket"
version = "0.2.0"
edition = "2024"
description = "Plaintext issue tracker for humans and coding agents"
license = "MIT"
repository = "https://github.com/cjohnhanson/tisket"
homepage = "https://github.com/cjohnhanson/tisket"
readme = "README.md"
authors = ["Cody Hanson"]
keywords = ["issue-tracker", "mcp", "markdown", "plaintext", "cli"]
categories = ["command-line-utilities", "development-tools"]

# Repository machinery belongs on GitHub. A consumer installing the
# crate gets the source, the license, and the README.
exclude = [
    ".tisket/",
    "tisket.yml",
    ".zettel/",
    "zettel.yml",
    ".gaff/",
    ".github/",
    ".agents/",
    "scripts/",
    "tests/missouri/",
    "CONTRIBUTING.md",
    "AGENTS.md",
    ".editorconfig",
    "rust-toolchain.toml",
]

[dependencies]
rmcp = { version = "3", features = ["server", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "signal", "net"] }
axum = "0.8"
camino = { version = "1", features = ["serde1"] }
clap = { version = "4", features = ["derive", "env", "unicode", "wrap_help"] }
clap_complete = "4"
clap_mangen = "0.2"
miette = { version = "7", features = ["fancy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
colored = "3.1.1"
grep-regex = "0.1.14"
grep-matcher = "0.1.8"
gix = { version = "0.86.0", default-features = false, features = ["basic", "sha1"] }
# The registry name is mdstore-core; `package` keeps the import path
# as `mdstore`, so no source in this crate changes. A path override
# for local work belongs in .cargo/config.toml, never here.
mdstore = { version = "0.3", package = "mdstore-core", features = ["mcp"] }
sigpipe = "0.1.3"

# A released binary carries no debug symbols, and a user installing a
# CLI never reads them. Thin LTO with one codegen unit trades build
# time for size and speed. A release builds once and installs often.
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
