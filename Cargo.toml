[package]
name = "tisket"
version = "0.2.0"
edition = "2024"
# 1.88, read from the graph rather than from the edition. Edition 2024
# needs 1.85, and that floor is too low here: a locked dependency asks
# for 1.88 itself. A floor that is too low is worse than none, because a
# consumer takes it and meets an error from inside the crate anyway.
rust-version = "1.88"
description = "Plaintext issue tracker for humans and coding agents"
license = "MIT"
repository = "https://github.com/cjohnhanson/tisket"
homepage = "https://github.com/cjohnhanson/tisket"
readme = "README.md"
authors = ["Cody Hanson"]
keywords = ["issue-tracker", "mcp", "markdown", "plaintext", "cli"]
categories = ["command-line-utilities", "development-tools"]

# Repository machinery belongs on GitHub. A consumer installing the
# crate gets the source, the license, and the README.
exclude = [
    # The npm wrapper and its generator are release machinery. The
    # generated platform packages each hold a built binary, and a
    # binary must never ship inside the crate.
    "npm/",
    # Drives npm/, dropped above, so it cannot run from the tarball.
    "tests/npm_wrapper_platforms.rs",
    ".tisket/",
    "tisket.yml",
    ".zettel/",
    "zettel.yml",
    ".gaff/",
    ".github/",
    ".agents/",
    "scripts/",
    # Shells out to scripts/merge-gate.sh, which the line above drops.
    "tests/merge_gate_guard.rs",
    "tests/missouri/",
    "CONTRIBUTING.md",
    "AGENTS.md",
    ".editorconfig",
    "rust-toolchain.toml",
]

[dependencies]
rmcp = { version = "3", features = ["server", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "signal", "net"] }
axum = "0.8"
camino = { version = "1", features = ["serde1"] }
clap = { version = "4", features = ["derive", "env", "unicode", "wrap_help"] }
clap_complete = "4"
clap_mangen = "0.2"
miette = { version = "7", features = ["fancy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
colored = "3.1.1"
grep-regex = "0.1.14"
grep-matcher = "0.1.8"
# 0.87, not 0.86. gix 0.86 pulls gix-protocol 0.64, which requires
# bisync, and every published bisync version is yanked. A consumer of
# this crate cannot resolve it. gix-protocol 0.65 dropped that
# dependency.
gix = { version = "0.87", default-features = false, features = ["basic", "sha1"] }
mdstore = { version = "0.5", package = "mdstore-core", features = ["mcp"] }
sigpipe = "0.1.3"
diataxis = { version = "0.1", default-features = false, features = ["cli"] }

# The docs pages are generated at build time from the same
# documentation set the `docs` subcommand reads.
[build-dependencies]
diataxis = { version = "0.1", default-features = false, features = ["build"] }

# `cargo deb` reads this. It produces target/debian/*.deb, which the
# release attaches to the GitHub release. Installing that file is
# `dpkg -i`, and it is not an apt repository: `apt-get install tisket`
# needs a hosted, signed repository that does not exist yet.
[package.metadata.deb]
maintainer = "cjohnhanson <cody@codyjhanson.com>"
section = "utils"
priority = "optional"
depends = "$auto"
extended-description = "Plaintext issue tracker for humans and coding agents"
assets = [
    ["target/release/tisket", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/tisket/README", "644"],
    ["LICENSE", "usr/share/doc/tisket/LICENSE", "644"],
]
